# Gerado por operacao/ferramentas/gerar-workflows.mjs. Não editar à mão.
# Trilha HCS suplementar. Só depois da prova dos dois acordos concluída e do deployment.json revisado.
# 0) Antes de cada disparo: hcs-registro.json e operacao-registro.json revisados cobrem TODA execução anterior do ambiente.
# 1) acao=criar-topico: cria o tópico (submit key da conta, sem admin key); registre hcs-topico.json por commit revisado.
# 2) acao=publicar: publica as mensagens canônicas que faltam. Cada lote: preparar (sem chave) -> guardar -> transmitir.
name: hcs-testnet
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: Digite HCS-TESTNET
        required: true
      acao:
        description: criar-topico ou publicar
        required: true
      operador:
        description: Id Hedera 0.0.N da conta da DELIVERPROOF_TESTNET_PRIVATE_KEY (público)
        required: true
      acordos:
        description: Ids dos acordos da prova, separados por vírgula
        required: false
        default: '1,2'
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: deliverproof-testnet
  cancel-in-progress: false
jobs:
  hcs:
    if: inputs.confirmar == 'HCS-TESTNET' && (inputs.acao == 'criar-topico' || inputs.acao == 'publicar')
    runs-on: ubuntu-24.04
    environment: testnet
    timeout-minutes: 45
    env:
      DELIVERPROOF_REDE: testnet
    steps:
      - name: Recusar re-execução (use um novo disparo, com registro revisto e autorização nova)
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo '{"etapa":"erro","codigo":"reexecucao_proibida_use_novo_disparo"}'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run hardhat:compile
      - name: Conferir a origem da cópia de prova
        run: node -e 'const o=require("./ORIGEM-PROVA.json"); if(!/^[0-9a-f]{40}$/.test(o.template)||!/^[0-9a-f]{40}$/.test(o.operacao)) process.exit(1); console.log(JSON.stringify(o))'
      - name: Baixar os diários HCS de execuções anteriores (só leitura)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p saida
          bash operacao/baixar-artefatos.sh hcs-diario- anteriores-hcs
      - name: Listar as execuções que entraram no ambiente (inventário independente dos artefatos, só leitura)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash operacao/listar-execucoes-ambiente.sh testnet execucoes-ambiente.json
      - name: Preparar HCS 01 (sem chave; resolve pelo mirror e fixa as intenções com o id da transação)
        env:
          ACAO: ${{ inputs.acao }}
          OPERADOR: ${{ inputs.operador }}
          ACORDOS: ${{ inputs.acordos }}
        run: node_modules/.bin/vite-node operacao/hcs.ts preparar --diario saida/hcs-diario.json --anteriores anteriores-hcs --execucoes-ambiente execucoes-ambiente.json --acao "$ACAO" --operador "$OPERADOR" --acordos "$ACORDOS"
      - name: Guardar o diário 01 antes de transmitir
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcs-diario-01
          path: saida/
          if-no-files-found: error
          retention-days: 90
      - name: Transmitir HCS 01 (único passo com a chave; id do diário, sem reenvio)
        env:
          DELIVERPROOF_TESTNET_AUTHORIZED: 'yes'
          DELIVERPROOF_TESTNET_PRIVATE_KEY: ${{ secrets.DELIVERPROOF_TESTNET_PRIVATE_KEY }}
          OPERADOR: ${{ inputs.operador }}
        run: node_modules/.bin/vite-node operacao/hcs.ts transmitir --diario saida/hcs-diario.json --operador "$OPERADOR"
      - name: Preparar HCS 02 (sem chave; resolve pelo mirror e fixa as intenções com o id da transação)
        env:
          ACAO: ${{ inputs.acao }}
          OPERADOR: ${{ inputs.operador }}
          ACORDOS: ${{ inputs.acordos }}
        run: node_modules/.bin/vite-node operacao/hcs.ts preparar --diario saida/hcs-diario.json --anteriores anteriores-hcs --execucoes-ambiente execucoes-ambiente.json --acao "$ACAO" --operador "$OPERADOR" --acordos "$ACORDOS"
      - name: Guardar o diário 02 antes de transmitir
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcs-diario-02
          path: saida/
          if-no-files-found: error
          retention-days: 90
      - name: Transmitir HCS 02 (único passo com a chave; id do diário, sem reenvio)
        env:
          DELIVERPROOF_TESTNET_AUTHORIZED: 'yes'
          DELIVERPROOF_TESTNET_PRIVATE_KEY: ${{ secrets.DELIVERPROOF_TESTNET_PRIVATE_KEY }}
          OPERADOR: ${{ inputs.operador }}
        run: node_modules/.bin/vite-node operacao/hcs.ts transmitir --diario saida/hcs-diario.json --operador "$OPERADOR"
      - name: Preparar HCS 03 (sem chave; resolve pelo mirror e fixa as intenções com o id da transação)
        env:
          ACAO: ${{ inputs.acao }}
          OPERADOR: ${{ inputs.operador }}
          ACORDOS: ${{ inputs.acordos }}
        run: node_modules/.bin/vite-node operacao/hcs.ts preparar --diario saida/hcs-diario.json --anteriores anteriores-hcs --execucoes-ambiente execucoes-ambiente.json --acao "$ACAO" --operador "$OPERADOR" --acordos "$ACORDOS"
      - name: Guardar o diário 03 antes de transmitir
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcs-diario-03
          path: saida/
          if-no-files-found: error
          retention-days: 90
      - name: Transmitir HCS 03 (único passo com a chave; id do diário, sem reenvio)
        env:
          DELIVERPROOF_TESTNET_AUTHORIZED: 'yes'
          DELIVERPROOF_TESTNET_PRIVATE_KEY: ${{ secrets.DELIVERPROOF_TESTNET_PRIVATE_KEY }}
          OPERADOR: ${{ inputs.operador }}
        run: node_modules/.bin/vite-node operacao/hcs.ts transmitir --diario saida/hcs-diario.json --operador "$OPERADOR"
      - name: Concluir (sem chave; resolve as abertas e relê a trilha no mirror)
        env:
          OPERADOR: ${{ inputs.operador }}
          ACORDOS: ${{ inputs.acordos }}
        run: node_modules/.bin/vite-node operacao/hcs.ts concluir --diario saida/hcs-diario.json --anteriores anteriores-hcs --execucoes-ambiente execucoes-ambiente.json --operador "$OPERADOR" --acordos "$ACORDOS"
      - name: Guardar o diário final
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcs-diario-99
          path: saida/
          if-no-files-found: ignore
          retention-days: 90
